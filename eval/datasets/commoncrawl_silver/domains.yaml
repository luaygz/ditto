  sample_size: 50
  sample_from: distinct detail-pattern URLs (index status 200, mime text/html)
  min_jsonld_rate: 0.6
  min_median_visible_words: 200
  robots_agents:
  - CCBot
  - ditto-benchmark
  min_robots_allowed_share: 0.9
  max_login_wall_share: 0.2
