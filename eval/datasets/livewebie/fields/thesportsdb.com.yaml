# https://openreview.net/forum?id=bIODmQ1TNd
fields:
  season_badge:
    description: 'Extract the badge of the season. Value: the image URL exactly as written in the img
      src attribute.'
    type: scalar
    type_check: url
  season_poster:
    description: 'Season poster (asked for in the query "Extract the badge and the poster of the seasonm").
      Value: the image URL exactly as written in the img src attribute.'
    type: scalar
    type_check: url
  event_link:
    description: 'What is the link of the event''s name? / Can you provide the URL for the event''s name?
      Value: the URL exactly as written in the a href attribute.'
    type: scalar
    type_check: url
  poster:
    description: 'Retrieve the poster image from the web page. Value: the image URL exactly as written
      in the img src attribute.'
    type: scalar
    type_check: url
  fanart:
    description: 'Retrieve the fanart for this game. Value: the image URL exactly as written in the img
      src attribute.'
    type: scalar
    type_check: url
  youtube_link:
    description: 'Youtube link (asked for in the query "Can you give me the poster image and youtube link
      for this game?"). Value: the URL exactly as written in the a href attribute.'
    type: scalar
    type_check: url
  team_badge_list:
    description: 'Collect the badges of the teams that participated in this match. Value: the image URL
      exactly as written in the img src attribute. One entry per item on the page.'
    type: list
    type_check: url
  lineup:
    description: Gather all player names of the teams that played the match (home and away). One entry
      per item on the page.
    type: list
  banner:
    description: 'Retrieve the banner for this game. Value: the image URL exactly as written in the img
      src attribute.'
    type: scalar
    type_check: url
  search_link:
    description: 'Fetch the search link for this match. Value: the URL exactly as written in the a href
      attribute.'
    type: scalar
    type_check: url
  profile_link:
    description: 'Give me the link of the player detail. / Please provide the URL for the player profile.
      Value: the URL exactly as written in the a href attribute.'
    type: scalar
    type_check: url
  thumb_image:
    description: 'Return the player''s thumbnail image. Value: the image URL exactly as written in the
      img src attribute.'
    type: scalar
    type_check: url
  thumb_image_list:
    description: 'Pull out all players'' thumbnail images. Value: the image URL exactly as written in
      the img src attribute. One entry per item on the page.'
    type: list
    type_check: url
  profile_link_list:
    description: 'Give me direct links to every player''s detailed profile. / Provide direct URLs to the
      detailed profiles of all players. Value: the URL exactly as written in the a href attribute. One
      entry per item on the page.'
    type: list
    type_check: url
  league_link:
    description: 'Retrieve the name link of the league. Value: the URL exactly as written in the a href
      attribute.'
    type: scalar
    type_check: url
  logo:
    description: 'Get the image of the league''s logo. Value: the image URL exactly as written in the
      img src attribute.'
    type: scalar
    type_check: url
  team:
    description: List the names of the teams found in the dedicated 'Teams' section. One entry per item
      on the page.
    type: list
  team_link_list:
    description: 'From the ''Teams'' section at the bottom, get the URL for each team''s page. Value:
      the URL exactly as written in the a href attribute. One entry per item on the page.'
    type: list
    type_check: url
  team_link:
    description: 'Point me to the team''s name link. Value: the URL exactly as written in the a href attribute.'
    type: scalar
    type_check: url
  team_badge:
    description: 'Present the club''s logo badge in image form. Value: the image URL exactly as written
      in the img src attribute.'
    type: scalar
    type_check: url
  member_image:
    description: 'Point me to the collection of team members'' images. Value: the image URL exactly as
      written in the img src attribute. One entry per item on the page.'
    type: list
    type_check: url
  member_link:
    description: 'Present the collection of club members'' links. Value: the URL exactly as written in
      the a href attribute. One entry per item on the page.'
    type: list
    type_check: url
  league_date:
    description: League date (asked for in the query "Collect the league's initial recorded date, corresponding
      link, and logo image.").
    type: scalar
