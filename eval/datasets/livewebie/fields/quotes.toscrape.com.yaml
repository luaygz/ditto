# Prompted-mode fields for quotes.toscrape.com from LiveWeb-IE (sbY99/LiveWeb-IE@34b56496f221),
# generated by eval/datasets/livewebie/build_fields.py from the dataset's queries.
# Groups per field: author: g_000; birth: g_000; tag_link: g_001; quote: g_002; author_list: g_002;
# tag_link_list: g_002; author_profile_link: g_002
# Derived from the LiveWeb-IE dataset. License: The LiveWeb-IE benchmark is released strictly for
# non-commercial research purposes only. By downloading or using this dataset, you agree to the
# following terms: 1. Non-Commercial Use: You may not use this dataset for any commercial purposes,
# including but not limited to training commercial models or enhancing commercial services. 2.
# Attribution: Any publication or report using this dataset must cite the original paper (LiveWeb-
# IE: A Benchmark For Online Web Information Extraction, ICLR 2026). 3. No Redistribution without
# License: You may not redistribute this dataset without including this license agreement. This
# restriction complies with the ethical agreements made with the website providers included in this
# benchmark.
# Cite: Seungbin Yang, Jihwan Kim, Jaemin Choi, Dongjin Kim, Soyoung Yang, ChaeHun Park, Jaegul
# Choo. LiveWeb-IE: A Benchmark For Online Web Information Extraction. ICLR 2026. arXiv:2603.13773.
# https://openreview.net/forum?id=bIODmQ1TNd
fields:
  author:
    description: Fetch the quote author's name.
    type: scalar
  birth:
    description: Collect the author's born details.
    type: scalar
  tag_link:
    description: 'Fetch link of the current viewing tag of the quote. Value: the URL exactly as written
      in the a href attribute.'
    type: scalar
    type_check: url
  quote:
    description: Get each quote. One entry per item on the page.
    type: list
  author_list:
    description: Collect each author of the quotes. One entry per item on the page.
    type: list
  tag_link_list:
    description: 'Extract all tag links of all quotes. Value: the URL exactly as written in the a href
      attribute. One entry per item on the page.'
    type: list
    type_check: url
  author_profile_link:
    description: 'Provide the reference link to the quote author. Value: the URL exactly as written in
      the a href attribute. One entry per item on the page.'
    type: list
    type_check: url
