# https://openreview.net/forum?id=bIODmQ1TNd
fields:
  title:
    description: Get each title of the video game.
    type: scalar
  price:
    description: Price (asked for in the query "Extract the game title and price of the video game").
    type: scalar
  image:
    description: 'Find the cover image of the game. Value: the image URL exactly as written in the img
      src attribute.'
    type: scalar
    type_check: url
  platform:
    description: Extract the game platform of the video game. / Extract the current platform of the game.
    type: scalar
  developer:
    description: Extract the game developer of the video game.
    type: scalar
  game_count:
    description: Identify how many games belong to the current platform.
    type: scalar
  title_list:
    description: Get each game's title. One entry per item on the page.
    type: list
  price_list:
    description: Extract all game prices. / Retrieve the prices of all games. One entry per item on the
      page.
    type: list
  image_list:
    description: 'Provide the images of all games. Value: the image URL exactly as written in the img
      src attribute. One entry per item on the page.'
    type: list
    type_check: url
  link:
    description: 'List the entire group of game links. Value: the URL exactly as written in the a href
      attribute. One entry per item on the page.'
    type: list
    type_check: url
  genre:
    description: Genre (asked for in the query "Provide all game titles, prices, images, links, and genres").
      One entry per item on the page.
    type: list
