fields:
  cocktail:
    description: Extract the name of the drink.
    type: scalar
  cocktail_image:
    description: 'Retrieve the drink''s image. / Fetch the image of the drink. Value: the image URL exactly
      as written in the img src attribute.'
    type: scalar
    type_check: url
  ingredient:
    description: Get the list of ingredient names for the drink. One entry per item on the page.
    type: list
  ingredient_image:
    description: 'Return all images that belong to the drink''s ingredients. Value: the image URL exactly
      as written in the img src attribute. One entry per item on the page.'
    type: list
    type_check: url
  ingredient_link:
    description: 'What are the detail links for every ingredient in the drink? Value: the URL exactly
      as written in the a href attribute. One entry per item on the page.'
    type: list
    type_check: url
  cocktail_list:
    description: Fetch the list of every drink's name. One entry per item on the page.
    type: list
  cocktail_image_list:
    description: 'List every drink with its image. Value: the image URL exactly as written in the img
      src attribute. One entry per item on the page.'
    type: list
    type_check: url
  cocktail_link:
    description: 'Present the full set of drink detail page links. Value: the URL exactly as written in
      the a href attribute. One entry per item on the page.'
    type: list
    type_check: url
