# Prompted-mode fields for arxiv.org from LiveWeb-IE (sbY99/LiveWeb-IE@34b56496f221),
# generated by eval/datasets/livewebie/build_fields.py from the dataset's queries.
# Groups per field: title: g_000; pdf_link: g_000; author_profile_link: g_000,g_001; author:
# g_000,g_001; title_list: g_001; pdf_link_list: g_001; subject: g_001; subject_list: g_002
# Derived from the LiveWeb-IE dataset. License: The LiveWeb-IE benchmark is released strictly for
# non-commercial research purposes only. By downloading or using this dataset, you agree to the
# following terms: 1. Non-Commercial Use: You may not use this dataset for any commercial purposes,
# including but not limited to training commercial models or enhancing commercial services. 2.
# Attribution: Any publication or report using this dataset must cite the original paper (LiveWeb-
# IE: A Benchmark For Online Web Information Extraction, ICLR 2026). 3. No Redistribution without
# License: You may not redistribute this dataset without including this license agreement. This
# restriction complies with the ethical agreements made with the website providers included in this
# benchmark.
# Cite: Seungbin Yang, Jihwan Kim, Jaemin Choi, Dongjin Kim, Soyoung Yang, ChaeHun Park, Jaegul
# Choo. LiveWeb-IE: A Benchmark For Online Web Information Extraction. ICLR 2026. arXiv:2603.13773.
# https://openreview.net/forum?id=bIODmQ1TNd
fields:
  title:
    description: Extract the title of the paper. / Retrieve the title of the research paper.
    type: scalar
  pdf_link:
    description: 'Pdf link (asked for in the query "Extract the title and pdf links of the paper"). Value:
      the URL exactly as written in the a href attribute.'
    type: scalar
    type_check: url
  author_profile_link:
    description: 'Fetch the set of URLs that point to detailed author information. Value: the URL exactly
      as written in the a href attribute. One entry per item on the page.'
    type: list
    type_check: url
  author:
    description: List the names of all authors for every paper. One entry per item on the page.
    type: list
  title_list:
    description: Extract all paper titles. One entry per item on the page.
    type: list
  pdf_link_list:
    description: 'Pdf link (asked for in the query "Extract all paper titles and pdf links"). Value: the
      URL exactly as written in the a href attribute. One entry per item on the page.'
    type: list
    type_check: url
  subject:
    description: I'd like to know the subject of all the papers.
    type: scalar
  subject_list:
    description: Extract all top-level subjects from the page. One entry per item on the page.
    type: list
