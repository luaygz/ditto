# https://openreview.net/forum?id=bIODmQ1TNd
fields:
  meal:
    description: Give me the name of the food. / Tell me what the food is called.
    type: scalar
  meal_image:
    description: 'Meal image (asked for in the query "Extract the title and image of the food"). Value:
      the image URL exactly as written in the img src attribute.'
    type: scalar
    type_check: url
  flag_image:
    description: 'Find the country image related to the food. Value: the image URL exactly as written
      in the img src attribute.'
    type: scalar
    type_check: url
  ingredient:
    description: Please provide the ingredient names used in this food. One entry per item on the page.
    type: list
  ingredient_image:
    description: 'Give me all ingredient images of the food. Value: the image URL exactly as written in
      the img src attribute. One entry per item on the page.'
    type: list
    type_check: url
  ingredient_link:
    description: 'Extract all links to detailed information of the food''s ingredients. Value: the URL
      exactly as written in the a href attribute. One entry per item on the page.'
    type: list
    type_check: url
  meal_link:
    description: 'List every food with its detail link. Value: the URL exactly as written in the a href
      attribute. One entry per item on the page.'
    type: list
    type_check: url
  meal_image_list:
    description: 'Meal image (asked for in the query "List every food with its image and detail link").
      Value: the image URL exactly as written in the img src attribute. One entry per item on the page.'
    type: list
    type_check: url
  meal_list:
    description: Get a list of all food names. One entry per item on the page.
    type: list
