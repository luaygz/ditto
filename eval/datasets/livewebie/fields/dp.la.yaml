# Prompted-mode fields for dp.la from LiveWeb-IE (sbY99/LiveWeb-IE@34b56496f221),
# generated by eval/datasets/livewebie/build_fields.py from the dataset's queries.
# Groups per field: title: g_000; exhibition_link: g_000; topic: g_001; topic_link: g_001;
# title_list: g_002; article_image: g_002; article_link: g_002; collection: g_003; subject_link:
# g_003; source_title: g_003; source_image: g_003; source_link: g_003; collection_list: g_004;
# collection_image: g_004; collection_link: g_004
