# Choo. LiveWeb-IE: A Benchmark For Online Web Information Extraction. ICLR 2026. arXiv:2603.13773.
# https://openreview.net/forum?id=bIODmQ1TNd
fields:
  title:
    description: Extract the title of the article.
    type: scalar
  exhibition_link:
    description: 'Which link in the article serves as the exhibition reference? Value: the URL exactly
      as written in the a href attribute.'
    type: scalar
    type_check: url
  topic:
    description: Please extract all sub topic titles. One entry per item on the page.
    type: list
  topic_link:
    description: 'Topic link (asked for in the query "Please extract all sub topic titles and links").
      Value: the URL exactly as written in the a href attribute. One entry per item on the page.'
    type: list
    type_check: url
  title_list:
    description: I want all the titles of the articles. One entry per item on the page.
    type: list
  article_image:
    description: 'List every article with its photo. Value: the image URL exactly as written in the img
      src attribute. One entry per item on the page.'
    type: list
    type_check: url
  article_link:
    description: 'Please provide all article detail page URLs. Value: the URL exactly as written in the
      a href attribute. One entry per item on the page.'
    type: list
    type_check: url
  collection:
    description: Which title belongs to this collection? / What is the title that is part of this collection?
    type: scalar
  subject_link:
    description: 'Return the entire set of subject links in the document. Value: the URL exactly as written
      in the a href attribute. One entry per item on the page.'
    type: list
    type_check: url
  source_title:
    description: Please provide every source collection name in the document. One entry per item on the
      page.
    type: list
  source_image:
    description: 'Extract all source set images from the document. Value: the image URL exactly as written
      in the img src attribute. One entry per item on the page.'
    type: list
    type_check: url
  source_link:
    description: 'I want the complete set of source set links from this resource. Value: the URL exactly
      as written in the a href attribute. One entry per item on the page.'
    type: list
    type_check: url
  collection_list:
    description: Get the complete list of material titles. One entry per item on the page.
    type: list
  collection_image:
    description: 'Fetch the thumbnails for every record. Value: the image URL exactly as written in the
      img src attribute. One entry per item on the page.'
    type: list
    type_check: url
  collection_link:
    description: 'Return the web addresses of all collection detail pages. Value: the URL exactly as written
      in the a href attribute. One entry per item on the page.'
    type: list
    type_check: url
