# benchmark.
# Cite: Seungbin Yang, Jihwan Kim, Jaemin Choi, Dongjin Kim, Soyoung Yang, ChaeHun Park, Jaegul
# Choo. LiveWeb-IE: A Benchmark For Online Web Information Extraction. ICLR 2026. arXiv:2603.13773.
# https://openreview.net/forum?id=bIODmQ1TNd
fields:
  title:
    description: Extract the title of the book. / Retrieve the title of the book.
    type: scalar
  upc:
    description: Upc (asked for in the query "Extract the title and UPC of the book").
    type: scalar
  price:
    description: Retrieve the book price.
    type: scalar
  stock_status:
    description: Get the stock status of the book.
    type: scalar
  book_image:
    description: 'Book image (asked for in the query "Scrape the book stock status and associated image").
      Value: the image URL exactly as written in the img src attribute.'
    type: scalar
    type_check: url
  category:
    description: Extract the book category. / Retrieve the category of the book.
    type: scalar
  count:
    description: Return the number of books.
    type: scalar
  title_list:
    description: Get all the titles of the books. / Retrieve every title of the books. One entry per item
      on the page.
    type: list
  price_list:
    description: Return all book prices. One entry per item on the page.
    type: list
  stock_status_list:
    description: Extract all book stock status. One entry per item on the page.
    type: list
  book_image_list:
    description: 'Collect all book images. Value: the image URL exactly as written in the img src attribute.
      One entry per item on the page.'
    type: list
    type_check: url
  book_link:
    description: 'Extract all book links. Value: the URL exactly as written in the a href attribute. One
      entry per item on the page.'
    type: list
    type_check: url
