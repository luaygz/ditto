# https://openreview.net/forum?id=bIODmQ1TNd
fields:
  title:
    description: Extract every title of the films. One entry per item on the page.
    type: list
  nominations:
    description: Nominations (asked for in the query "Extract every title and nomination count of the
      films"). One entry per item on the page.
    type: list
  awards:
    description: Tell me how many awards each film has won. One entry per item on the page.
    type: list
  country:
    description: Please extract all country names. One entry per item on the page.
    type: list
  capital:
    description: Capital (asked for in the query "Please extract all country names and capitals of the
      countries"). One entry per item on the page.
    type: list
  population:
    description: Show me the population of all countries. One entry per item on the page.
    type: list
  area:
    description: Get each country's area. One entry per item on the page.
    type: list
  team:
    description: Extract all hockey team names. / Retrieve all names of hockey teams. One entry per item
      on the page.
    type: list
  year:
    description: Return the whole set of years. One entry per item on the page.
    type: list
  wins:
    description: Tell me the wins of all hockey teams. / List the total wins for every hockey team. One
      entry per item on the page.
    type: list
  goals_for:
    description: Get each hockey team's GF value. One entry per item on the page.
    type: list
  turtle_name:
    description: List every turtle along with its name. One entry per item on the page.
    type: list
  turtle_image:
    description: 'Get each turtle''s image. Value: the image URL exactly as written in the img src attribute.
      One entry per item on the page.'
    type: list
    type_check: url
  turtle_link:
    description: 'Retrieve every turtle link. Value: the URL exactly as written in the a href attribute.
      One entry per item on the page.'
    type: list
    type_check: url
