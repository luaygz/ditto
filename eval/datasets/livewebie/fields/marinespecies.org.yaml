# Prompted-mode fields for marinespecies.org from LiveWeb-IE (sbY99/LiveWeb-IE@34b56496f221),
# generated by eval/datasets/livewebie/build_fields.py from the dataset's queries.
# Groups per field: photo_title: g_000; species_link: g_000; author: g_000; author_profile_link:
# g_000; species_image: g_000; species: g_000; species_image_list: g_001; species_list: g_001;
# species_link_list: g_001; editor_profile_link: g_002; country: g_002; editor_type: g_002;
# institute: g_002; group: g_003; group_image: g_003; group_link: g_003
# Derived from the LiveWeb-IE dataset. License: The LiveWeb-IE benchmark is released strictly for
# non-commercial research purposes only. By downloading or using this dataset, you agree to the
# following terms: 1. Non-Commercial Use: You may not use this dataset for any commercial purposes,
# including but not limited to training commercial models or enhancing commercial services. 2.
# Attribution: Any publication or report using this dataset must cite the original paper (LiveWeb-
# IE: A Benchmark For Online Web Information Extraction, ICLR 2026). 3. No Redistribution without
