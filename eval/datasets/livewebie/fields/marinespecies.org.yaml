# benchmark.
# Cite: Seungbin Yang, Jihwan Kim, Jaemin Choi, Dongjin Kim, Soyoung Yang, ChaeHun Park, Jaegul
# Choo. LiveWeb-IE: A Benchmark For Online Web Information Extraction. ICLR 2026. arXiv:2603.13773.
# https://openreview.net/forum?id=bIODmQ1TNd
fields:
  photo_title:
    description: Extract the title of the photo.
    type: scalar
  species_link:
    description: 'Extract the link of this species. Value: the URL exactly as written in the a href attribute.'
    type: scalar
    type_check: url
  author:
    description: Extract the name of this author of the photo. / Retrieve the name of the author depicted
      in this photo.
    type: scalar
  author_profile_link:
    description: 'Retrieve the author''s hyperlink from this image. Value: the URL exactly as written
      in the a href attribute.'
    type: scalar
    type_check: url
  species_image:
    description: 'Species image (asked for in the query "Extract the name of the author, link of the species
      and image of this species of the photo"). Value: the image URL exactly as written in the img src
      attribute.'
    type: scalar
    type_check: url
  species:
    description: Species (asked for in the query "Extract the name and image of this species of the photo").
    type: scalar
  species_image_list:
    description: 'Please extract all photo urls. Value: the image URL exactly as written in the img src
      attribute. One entry per item on the page.'
    type: list
    type_check: url
  species_list:
    description: Return the names of all aquatic organisms. One entry per item on the page.
    type: list
  species_link_list:
    description: 'Fetch the hyperlinks that direct to the full information of marine life. Value: the
      URL exactly as written in the a href attribute. One entry per item on the page.'
    type: list
    type_check: url
  editor_profile_link:
    description: 'Bring me the collection of editor hyperlinks. Value: the URL exactly as written in the
      a href attribute. One entry per item on the page.'
    type: list
    type_check: url
  country:
    description: Country (asked for in the query "Give me the collection of editor hyperlinks and editor
      countries"). One entry per item on the page.
    type: list
  editor_type:
    description: Editor type (asked for in the query "Give me the collection of editor hyperlinks, editor
      types, editor institutes, and editor countries"). One entry per item on the page.
    type: list
  institute:
    description: Institute (asked for in the query "Give me the collection of editor hyperlinks, editor
      types, editor institutes, and editor countries"). One entry per item on the page.
    type: list
  group:
    description: Extract the names of all biological groups. One entry per item on the page.
    type: list
  group_image:
    description: 'Get the complete set of visuals for all taxonomy groups. Value: the image URL exactly
      as written in the img src attribute. One entry per item on the page.'
    type: list
    type_check: url
  group_link:
    description: 'Group link (asked for in the query "Point me to the detail page links of taxonomy groups
      and their names"). Value: the URL exactly as written in the a href attribute. One entry per item
      on the page.'
    type: list
    type_check: url
