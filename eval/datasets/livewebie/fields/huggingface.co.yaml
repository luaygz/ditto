# Choo. LiveWeb-IE: A Benchmark For Online Web Information Extraction. ICLR 2026. arXiv:2603.13773.
# https://openreview.net/forum?id=bIODmQ1TNd
fields:
  title:
    description: Extract the title of the paper. / Retrieve the title of the research paper.
    type: scalar
  source_link:
    description: 'Source link (asked for in the query "Extract the title and arxiv link of the paper").
      Value: the URL exactly as written in the a href attribute.'
    type: scalar
    type_check: url
  model_citation_count:
    description: Get the number of models referencing this paper.
    type: scalar
  author:
    description: Can you fetch all the names of the authors? One entry per item on the page.
    type: list
  citing_model_link:
    description: 'Fetch the whole collection of model detail URLs that cite the paper. Value: the URL
      exactly as written in the a href attribute. One entry per item on the page.'
    type: list
    type_check: url
  paper_link:
    description: 'Please extract all paper links. Value: the URL exactly as written in the a href attribute.
      One entry per item on the page.'
    type: list
    type_check: url
  publish_date:
    description: Extract the date when these papers were added.
    type: scalar
  title_list:
    description: Fetch the list of names for every paper. One entry per item on the page.
    type: list
  author_count:
    description: Show me the list of author counts for all papers. One entry per item on the page.
    type: list
