# https://openreview.net/forum?id=bIODmQ1TNd
fields:
  vehicle:
    description: Present the name of the automobile.
    type: scalar
  tank_size:
    description: Retrieve the tank size of the car.
    type: scalar
  vehicle_image:
    description: 'Fetch the thumbnail image of this vehicle. Value: the image URL exactly as written in
      the img src attribute.'
    type: scalar
    type_check: url
  annual_fuel_cost:
    description: Please extract all annual fuel cost for each car. One entry per item on the page.
    type: list
  driver_mpg:
    description: Please extract all driver mpg. One entry per item on the page.
    type: list
  vehicle_link:
    description: 'Extract the detail links of all cars. / Point me to the profile links of every automobile
      category. Value: the URL exactly as written in the a href attribute. One entry per item on the page.'
    type: list
    type_check: url
  vehicle_image_list:
    description: 'Present the collection of car thumbnails. / Return every car model image. Value: the
      image URL exactly as written in the img src attribute. One entry per item on the page.'
    type: list
    type_check: url
  vehicle_list:
    description: Please extract all car name. / Kindly retrieve every car name available. One entry per
      item on the page.
    type: list
  vehicle_type:
    description: Which type names belong to these vehicles? / What are the type names associated with
      these vehicles? One entry per item on the page.
    type: list
