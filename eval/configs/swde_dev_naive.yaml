name: swde_dev_naive
description: >-
  SWDE development slice, naive per-page LLM baseline on a seeded 50-page sample per site (same pages as swde_dev_ditto accuracy_sample); cost per 1,000 pages extrapolated.
dataset: swde
selection:
  split: dev
method:
  kind: baseline
  baseline: naive_llm
models:                      # pinned; same main model as ditto so the comparison is fair
  baseline: openai/gpt-6.1-sol
budget_usd: 10.0           # real (uncached) spend cap; sites are run round-robin across verticals
sample:
  pages_per_site: 50          # seeded sample per site (budget-limited; brief cap 200); baselines run on it, ditto also scores it
seeds:
  run: 1                     # page samples (identical across ditto and baselines)
  synth: 1
