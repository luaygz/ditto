name: cc_silver_naive
description: >-
  Common Crawl silver set, naive per-page LLM baseline on a seeded 40-page sample per domain (same input as ditto: scripts removed); cost per 1,000 pages extrapolated.
dataset: cc_silver
selection:
  split: all
method:
  kind: baseline
  baseline: naive_llm
models:                      # pinned; same main model as ditto so the comparison is fair
  baseline: openai/gpt-6.1-sol
budget_usd: 6.0            # real (uncached) spend cap; sites are run round-robin across verticals
sample:
  pages_per_site: 40          # seeded sample per site (budget-limited; brief cap 200); baselines run on it, ditto also scores it
seeds:
  run: 1                     # page samples (identical across ditto and baselines)
  synth: 1
