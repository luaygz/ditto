name: swde_test_autoscraper
description: >-
  SWDE frozen test split, AutoScraper (EMNLP 2024) with its model calls on the OpenAI adapter; recorded as not run when it cannot be made to run in bounded effort.
dataset: swde
selection:
  split: test
method:
  kind: baseline
  baseline: autoscraper
models:                      # pinned; same main model as ditto so the comparison is fair
  baseline: openai/gpt-6.1-sol
budget_usd: 2.0            # real (uncached) spend cap; sites are run round-robin across verticals
sample:
  pages_per_site: 20          # seeded sample per site (budget-limited; brief cap 200); baselines run on it, ditto also scores it
seeds:
  run: 1                     # page samples (identical across ditto and baselines)
  synth: 1
