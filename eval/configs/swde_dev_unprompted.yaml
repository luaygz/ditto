name: swde_dev_unprompted
description: >-
  SWDE development slice, ditto unprompted mode: LLM field names aligned to label names by value overlap on 50 pages per template, then recall of the labeled attributes.
dataset: swde
selection:
  split: dev
method:
  kind: ditto
  mode: unprompted
  params:
    min_cluster_size: 20
    max_repair_calls: 3
    tail: skip
models:                      # pinned; the run fails if the LLM layer resolves another id
  generation: openai/gpt-6.1-sol
  repair: openai/gpt-6.1-sol
  probe: openai/gpt-5.4-mini
  tail_direct: openai/gpt-5.4-mini
budget_usd: 3.0            # real (uncached) spend cap; sites are run round-robin across verticals
sample:
  pages_per_site: null
  align_pages: 50
  align_min_fraction: 0.1
seeds:
  run: 1                     # page samples (identical across ditto and baselines)
  synth: 1
