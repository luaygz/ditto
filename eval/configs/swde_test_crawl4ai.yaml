name: swde_test_crawl4ai
description: >-
  SWDE frozen test split, Crawl4AI JsonCssExtractionStrategy.generate_schema on one sample page per template, applied to every labeled page.
dataset: swde
selection:
  split: test
  sites: [auto-automotive, auto-autoweb, auto-carquotes, auto-cars, auto-kbb, book-barnesandnoble, book-bookdepository, book-booksamillion, book-borders, book-buy, camera-buy, camera-compsource, camera-ecost, camera-jr, camera-newegg, job-hotjobs, job-job, job-jobcircle, job-jobtarget, job-monster, movie-boxofficemojo, movie-hollywood, movie-iheartmovies, movie-imdb, nbaplayer-foxsports, nbaplayer-msnca, nbaplayer-nba, nbaplayer-si, restaurant-gayot, restaurant-opentable, restaurant-pickarestaurant, restaurant-restaurantica, university-collegeprowler, university-collegetoolkit, university-ecampustours, university-embark]   # the sites finished within budget (Crawl4AI cost ~$0.3-1 per site)
method:
  kind: baseline
  baseline: crawl4ai_schema
models:                      # pinned; same main model as ditto so the comparison is fair
  baseline: openai/gpt-6.1-sol
budget_usd: 1.0          # real (uncached) spend cap; sites are run round-robin across verticals
sample:
  pages_per_site: null       # every labeled page
seeds:
  run: 1                     # page samples (identical across ditto and baselines)
  synth: 1
