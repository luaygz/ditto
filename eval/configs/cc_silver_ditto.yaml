name: cc_silver_ditto
description: >-
  Common Crawl silver set (8 named domains, labels from the sites' own JSON-LD, scripts stripped from the extractor input), ditto prompted mode. Also scores the 40-page samples the naive baseline runs on.
dataset: cc_silver
selection:
  split: all
method:
  kind: ditto
  mode: prompted
  params:
    min_cluster_size: 20
    max_repair_calls: 3
    tail: skip
models:                      # pinned; the run fails if the LLM layer resolves another id
  generation: openai/gpt-6.1-sol
  repair: openai/gpt-6.1-sol
  probe: openai/gpt-5.4-mini
  tail_direct: openai/gpt-5.4-mini
budget_usd: 6.0            # real (uncached) spend cap; sites are run round-robin across verticals
sample:
  pages_per_site: 20          # seeded sample per site (budget-limited; brief cap 200); baselines run on it, ditto also scores it
seeds:
  run: 1                     # page samples (identical across ditto and baselines)
  synth: 1
