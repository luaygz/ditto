# T06 (recipe): prompted-mode fields, generated by `ditto synth` (seed 1)
name: the recipe name shown as the page heading
cook_time: cooking time
cuisine: cuisine
published: publication date
rating: average rating out of 5
course: meal course
prep_time: preparation time
total_time: total time
author: recipe author
servings: number of servings
description: recipe introduction paragraph
steps: ordered preparation steps
nutrition: 'nutrition table with nutrient, amount and daily value (columns: nutrient, per_100g, amount, daily_value)'
recipe_info: recipe information pairs such as diet and equipment
