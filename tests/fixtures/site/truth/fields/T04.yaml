# T04 (article): prompted-mode fields, generated by `ditto synth` (seed 1)
headline: the article headline shown as the page heading
comment_count: number of comments
badge: badge label
published: publication date
section: site section
word_count: number of words
permalink: permanent link URL
support_phone: support phone number
listing_date: date the entry was added
region: region or country
summary: one-sentence summary
author: article author
verification: verification status
tags: article tags
comments: 'reader comments with author, date and text (columns: author, date, comment, location)'
article_info: article metadata pairs
