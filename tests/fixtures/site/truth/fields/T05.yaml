# T05 (job): prompted-mode fields, generated by `ditto synth` (seed 1)
title: the job title shown as the page heading
salary: annual salary including the currency symbol
apply_url: URL of the application form
date_posted: date the job was posted
experience_level: seniority level
department: department of the role
contact_email: recruiter contact email
openings: number of open positions
deadline: application deadline
description: job description paragraph
employment_type: employment type such as Full-time
benefits: list of benefits
open_positions: 'table of open positions per location (columns: location, start, team, positions)'
job_details: job detail pairs such as schedule and travel
