# T07 (vehicle): prompted-mode fields, generated by `ditto synth` (seed 1)
title: the vehicle title shown as the page heading
color: exterior color
description: seller description paragraph
condition: condition
listed: date listed
dealer: dealer name
fuel: fuel type
make: make
transmission: transmission
vin: vehicle identification number
mileage: mileage
features: vehicle features
service_history: 'service history with date, service and mileage (columns: date, shop, service, mileage)'
vehicle_specs: vehicle specification pairs such as engine and drivetrain
