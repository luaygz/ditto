# T01 (course): prompted-mode fields, generated by `ditto synth` (seed 1)
title: the course title shown as the page heading
rating: rating out of 5
enrolled: number of enrolled students
effort: weekly effort
level: course level
start_date: start date
description: course description paragraph
credential: certificate awarded
contact_email: contact email
language: teaching language
instructor: instructor
topics: topics covered
syllabus: 'syllabus table with week, topic and hours (columns: week, topic, hours, reading)'
course_facts: course fact pairs such as format and prerequisites
